name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: https://gramazio-tabitha.vercel.app
      - run: npm run smoke:dist
        env:
          SITE_URL: https://gramazio-tabitha.vercel.app
      - run: npm run check:release
        env:
          SITE_URL: https://gramazio-tabitha.vercel.app
